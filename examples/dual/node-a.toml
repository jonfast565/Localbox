# Same-host dual-instance test node A.
# Pair with examples/dual/node-b.toml — see README "Run two nodes" / GUI dual recipe.

pc_name = "alice"
instance_id = "node-a"
display_name = "Alice (local test)"

listen_port = 5000
plain_listen_port = 5002
discovery_port = 5001
# Fan out so node-b (bound on 6001) receives DISCOVER packets.
discovery_send_ports = [5001, 6001]

enable_dht = false
enable_utp = false

app_state = "mirrorhost"
# Plaintext keeps local dual testing free of invite/CA bootstrap.
use_tls_for_peers = false
request_handling = "manual"

db_path = "examples/dual/data/node-a.db"
log_path = "examples/dual/data/node-a.log"
control_socket = "examples/dual/data/node-a.sock"
remote_share_root = "examples/dual/data/remote-a"

tls_cert_path = "certs/localbox.cert.pem"
tls_key_path = "certs/localbox.key.pem"
tls_ca_cert_path = "certs/ca.cert.pem"

[[shares]]
name = "docs"
root_path = "examples/dual/data/docs-a"
recursive = true
