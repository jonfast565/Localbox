[package]
name = "localbox-gui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["jfast"]
description = "Iced desktop GUI for Localbox control plane"

[[bin]]
name = "localbox-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dark-light = "1"
iced = { version = "0.13", features = ["tokio"] }
localbox-core = { path = "../localbox-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
