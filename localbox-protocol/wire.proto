syntax = "proto3";

package protocol;

message AdvertisedShare {
  string name = 1;
  bool recursive = 2;
  // "manual" | "auto"
  string sync = 3;
  string pull = 4;
}

message Hello {
  string pc_name = 1;
  string instance_id = 2;
  uint32 listen_port = 3;
  // Deprecated: kept for wire field number stability; prefer advertised_shares.
  repeated string shares = 4;
  uint32 plain_port = 5;
  bool use_tls_for_peers = 6;
  bool decline_remote_shares = 7;
  string display_name = 8;
  string app_state = 9;
  uint32 utp_port = 10;
  repeated AdvertisedShare advertised_shares = 11;
}

enum ChangeKind {
  CREATE = 0;
  MODIFY = 1;
  DELETE = 2;
}

message FileMeta {
  string path = 1;
  uint64 size = 2;
  int64 mtime = 3;
  bytes hash = 4;
  int64 version = 5;
  bool deleted = 6;
}

message FileChange {
  int64 seq = 1;
  bytes share_id = 2;
  string path = 3;
  ChangeKind kind = 4;
  FileMeta meta = 5;
}

enum BatchBasis {
  BATCH_BASIS_SNAPSHOT = 0;
  BATCH_BASIS_JOURNAL = 1;
}

message BatchManifest {
  string batch_id = 1;
  bytes share_id = 2;
  string from_node = 3;
  int64 created_at = 4;
  repeated FileChange changes = 5;
  // How to read changes[].seq. Default (0) is SNAPSHOT: no journal positions.
  BatchBasis basis = 6;
  // Journal range covered, in the sender's namespace. from exclusive, to inclusive.
  int64 journal_from_seq = 7;
  int64 journal_to_seq = 8;
}

message BatchAck {
  bytes share_id = 1;
  int64 upto_seq = 2;
  string batch_id = 3;
}

message FileChunk {
  bytes share_id = 1;
  string path = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool eof = 5;
  string batch_id = 6;
}

message TransferRequest {
  string request_id = 1;
  string share_name = 2;
  bytes share_id = 3;
  repeated string paths = 4;
  int64 since_seq = 5;
  string from_pc = 6;
  string from_instance = 7;
}

message TransferReply {
  string request_id = 1;
  bool accepted = 2;
  string reason = 3;
}

message TransferPushOffer {
  string offer_id = 1;
  string share_name = 2;
  bytes share_id = 3;
  repeated string paths = 4;
  string from_pc = 5;
  string from_instance = 6;
}

message ChatMessage {
  string thread_id = 1;
  string message_id = 2;
  string thread_kind = 3;
  string peer_key = 4;
  string share_name = 5;
  string from_pc = 6;
  string from_instance = 7;
  string body = 8;
  string attachment_share = 9;
  string attachment_path = 10;
  int64 created_at = 11;
}

message ChatAck {
  string message_id = 1;
}

message WireEnvelope {
  oneof msg {
    Hello hello = 1;
    BatchManifest batch = 2;
    FileChunk file_chunk = 3;
    BatchAck batch_ack = 4;
    TransferRequest transfer_request = 5;
    TransferReply transfer_reply = 6;
    ChatMessage chat_message = 7;
    ChatAck chat_ack = 8;
    TransferPushOffer transfer_push_offer = 9;
  }
}
